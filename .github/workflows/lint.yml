name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Install RuboCop
        run: gem install rubocop --no-document

      - name: Run RuboCop
        run: rubocop
